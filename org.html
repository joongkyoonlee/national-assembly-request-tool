<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A부 조직·키워드 찾기</title>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0/dist/fuse.min.js"></script>
  <style>
    :root {
      --navy: #17375e;
      --blue: #246b91;
      --paper: #f4f7f9;
      --white: #fff;
      --ink: #15283a;
      --muted: #657584;
      --line: #d8e1e8;
      --chip: #eaf2f6;
      --focus: #d86e4b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.55;
    }

    .masthead { height: 8px; background: var(--navy); }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 440px);
      gap: 40px;
      align-items: end;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--navy);
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.12;
      letter-spacing: -.045em;
    }

    .lead { margin: 0; color: var(--muted); }

    .search-wrap { position: relative; }

    .search-wrap svg {
      position: absolute;
      left: 17px;
      top: 50%;
      width: 21px;
      height: 21px;
      color: var(--blue);
      transform: translateY(-50%);
      pointer-events: none;
    }

    #search {
      width: 100%;
      min-height: 54px;
      padding: 13px 48px 13px 50px;
      border: 2px solid var(--navy);
      border-radius: 8px;
      background: var(--white);
      color: var(--ink);
      font: inherit;
      font-size: 17px;
      outline: none;
      transition: box-shadow .18s ease, border-color .18s ease;
    }

    #search:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 4px rgba(216, 110, 75, .16);
    }

    #clear {
      position: absolute;
      right: 10px;
      top: 50%;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      line-height: 1;
      transform: translateY(-50%);
      cursor: pointer;
    }

    #clear:hover, #clear:focus-visible { background: var(--chip); color: var(--navy); }
    #clear[hidden] { display: none; }

    .meta {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      min-height: 40px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    #count { font-weight: 800; color: var(--navy); }

    .table-frame {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 16px 38px rgba(23, 55, 94, .08);
    }

    table { width: 100%; border-collapse: collapse; }

    th, td {
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--navy);
      color: var(--white);
      font-size: 14px;
      letter-spacing: -.01em;
    }

    th:nth-child(1) { width: 23%; }
    th:nth-child(2) { width: 26%; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #f8fbfc; }
    td:nth-child(2) { font-weight: 800; color: var(--navy); }

    .keywords { display: flex; flex-wrap: wrap; gap: 7px; }

    .keyword {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--chip);
      color: #315b72;
      font-size: 13px;
    }

    #status {
      padding: 56px 20px;
      color: var(--muted);
      text-align: center;
    }

    .results-updated { animation: results-in .22s ease both; }

    @keyframes results-in {
      from { opacity: .45; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 760px) {
      main { width: min(100% - 20px, 1120px); padding-top: 32px; }
      header { grid-template-columns: 1fr; gap: 24px; }
      .table-frame { overflow-x: auto; }
      table { min-width: 700px; }
      th, td { padding: 14px 15px; }
      .meta { align-items: flex-start; flex-direction: column; gap: 2px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="masthead" aria-hidden="true"></div>
  <main>
    <header>
      <div>
        <h1>조직·키워드 찾기</h1>
        <p class="lead">과 이름이나 업무 키워드를 입력하면 오타가 있어도 가까운 결과를 찾습니다.</p>
      </div>
      <div class="search-wrap">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
        </svg>
        <label for="search" class="sr-only">과 또는 대표키워드 검색</label>
        <input id="search" type="search" placeholder="예: 디지털정책과, 인공진능" autocomplete="off">
        <button id="clear" type="button" aria-label="검색어 지우기" title="검색어 지우기" hidden>×</button>
      </div>
    </header>

    <div class="meta" aria-live="polite">
      <span id="count">조직 정보를 불러오는 중입니다.</span>
      <span>검색 대상: 과 · 대표키워드</span>
    </div>

    <div class="table-frame">
      <table>
        <thead>
          <tr><th scope="col">실국</th><th scope="col">과</th><th scope="col">대표키워드</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="status">org.json을 불러오는 중입니다.</div>
    </div>
  </main>

  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
  <script>
    const searchInput = document.querySelector('#search');
    const clearButton = document.querySelector('#clear');
    const rows = document.querySelector('#rows');
    const status = document.querySelector('#status');
    const count = document.querySelector('#count');
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let organizations = [];
    let fuse;

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[char]));
    }

    function render(items, query = '') {
      rows.innerHTML = items.map(item => `
        <tr>
          <td>${escapeHtml(item['실국'])}</td>
          <td>${escapeHtml(item['과'])}</td>
          <td><div class="keywords">${item['대표키워드'].map(keyword =>
            `<span class="keyword">${escapeHtml(keyword)}</span>`).join('')}</div></td>
        </tr>`).join('');

      status.hidden = items.length > 0;
      if (!items.length) status.textContent = '가까운 과나 키워드를 찾지 못했습니다. 검색어를 조금 줄여 보세요.';
      count.textContent = query
        ? `“${query}” 검색 결과 ${items.length}개`
        : `전체 ${items.length}개 과`;

      if (!reduceMotion && items.length) {
        rows.classList.remove('results-updated');
        void rows.offsetWidth;
        rows.classList.add('results-updated');
      }
    }

    function filterOrganizations() {
      const query = searchInput.value.trim();
      clearButton.hidden = query.length === 0;
      const normalizedQuery = query.toLocaleLowerCase('ko-KR');
      const exactMatches = query ? organizations.filter(item => {
        const department = item['과'].toLocaleLowerCase('ko-KR');
        const keywords = item['대표키워드'].map(keyword => keyword.toLocaleLowerCase('ko-KR'));
        return department.includes(normalizedQuery) || keywords.some(keyword => keyword.includes(normalizedQuery));
      }) : [];
      const result = !query
        ? organizations
        : exactMatches.length
          ? exactMatches
          : fuse.search(query).map(entry => entry.item);
      render(result, query);
    }

    async function initialize() {
      try {
        if (typeof Fuse === 'undefined') throw new Error('Fuse.js를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
        const response = await fetch('./org.json');
        if (!response.ok) throw new Error(`org.json을 읽지 못했습니다. (HTTP ${response.status})`);
        organizations = await response.json();
        fuse = new Fuse(organizations, {
          keys: ['과', '대표키워드'],
          threshold: 0.42,
          distance: 100,
          ignoreLocation: true,
          minMatchCharLength: 2,
          shouldSort: true
        });
        render(organizations);
        searchInput.disabled = false;
      } catch (error) {
        rows.innerHTML = '';
        status.hidden = false;
        status.textContent = error.message;
        count.textContent = '조직 정보를 표시할 수 없습니다.';
        searchInput.disabled = true;
      }
    }

    searchInput.disabled = true;
    searchInput.addEventListener('input', filterOrganizations);
    clearButton.addEventListener('click', () => {
      searchInput.value = '';
      filterOrganizations();
      searchInput.focus();
    });

    initialize();
  </script>
</body>
</html>
